description: 'Vera Therapeutics is a clinical- and commercial-stage biopharmaceutical company based in
  Brisbane, California, developing treatments for serious immunological and inflammatory diseases of the
  kidney. Its lead program, atacicept (marketed as TRUTAKNA), is a dual BAFF/APRIL inhibitor for IgA
  nephropathy (IgAN). Surfaced as a portfolio company of GV and added to the API Evangelist network for
  enrichment, Vera Therapeutics publishes a corporate and patient-facing website (veratx.com) but exposes
  no public developer portal, API, SDKs, or machine-readable API surface. Sector: life-sciences.'
